# 用 Docker 部署到个人服务器（Webhook 方式）—— 移植自旧站，替换旧站部署。
# 流程：构建机生成发行快照 → 构建并推送镜像到 Docker Hub → curl 触发服务器 webhook 拉取重启。
# 用与旧站「相同的镜像名 + 相同的 webhook」，服务器拉取后即用新站替换旧站。
#
# 需要在本仓库 Settings → Secrets 配置（与旧站同名）：
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN / WEBHOOK_URL / WEBHOOK_TOKEN
# 替换旧站后，记得停用旧仓库的 deploy-docker 工作流，避免两边都往同一镜像/服务器推。
name: 构建并部署到服务器（Docker）

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
  # 发行库（tuyangJs/JadeView）发版后自动触发：release.yml 收尾向本仓库发
  # repository_dispatch，构建时重新生成发行快照，站点即刻带上新版本数据。
  repository_dispatch:
    types: [refresh-releases]

env:
  IMAGE_NAME: yiminger/jadeview_docs

concurrency:
  group: docker-deploy
  cancel-in-progress: false

# packages:write：GITHUB_TOKEN 推 ghcr.io 需要（默认只读，推包会报
# "installation not allowed to Create organization package"）
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 构建机（海外、可达 GitHub）先生成发行快照，带 token 提限额；
      # 镜像构建内用 `npx dumi build` 不再直连 GitHub（见 Dockerfile 说明）。
      # 脚本仅用 Node 内置模块，无需安装依赖。
      - name: 生成发行快照
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-changelog.mjs

      # 贡献者快照：按文档页拉提交作者 + 下载头像为同源静态文件（运行时不连 GitHub）。
      # 与发行快照同理，只在构建机执行，产物随源码 COPY 进镜像。
      - name: 生成文档贡献者快照
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-contributors.mjs

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 同时登录 ghcr.io：国内服务器拉 docker.io 基本不通（直连超时、公共加速器 403），
      # ghcr 国内可达性好，作为服务器实际拉取源。
      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/jadeviewdocs/docs:latest
            ghcr.io/jadeviewdocs/docs:${{ github.sha }}

      # MCP 分发只走 npm（不再构建服务器镜像）：mcp 源码有变更才发版。
      # 版本号自动递增——本地版本高于 registry 时发本地版本（如大版本重写），
      # 否则基于 registry 最新版 patch +1，无需手动改 mcp/package.json。
      # npm 包只含 dist（不含 docs），故文档更新触发的重建不会发版。
      # 发布失败（token 权限等）不阻塞站点镜像部署。
      - name: 发布 MCP 到 npm
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.before }}"..HEAD -- mcp/src mcp/package.json mcp/tsconfig.json 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "mcp 源码无变化（或非 push 触发），跳过 npm 发布"
            exit 0
          fi
          cd mcp
          npm install
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view jadeview-docs-mcp version 2>/dev/null || echo none)
          if [ "$REMOTE" = "none" ]; then
            VER=$LOCAL
          else
            NEWER=$(printf '%s\n' "$LOCAL" "$REMOTE" | sort -V | tail -1)
            if [ "$NEWER" = "$LOCAL" ] && [ "$LOCAL" != "$REMOTE" ]; then
              VER=$LOCAL
            else
              VER=$(printf '%s\n' "$REMOTE" | awk -F. '{$NF++; print}' OFS=.)
            fi
          fi
          npm version "$VER" --no-git-tag-version
          npm run build
          npm publish --access public
          echo "已发布 jadeview-docs-mcp@$VER"

      - name: 触发服务器 webhook 拉取部署
        run: |
          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${{ secrets.WEBHOOK_TOKEN }}" \
            -d '{
              "image": "ghcr.io/jadeviewdocs/docs:latest",
              "repository": "${{ github.repository }}",
              "commit": "${{ github.sha }}"
            }' \
            --connect-timeout 10 \
            --max-time 300 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 120 \
            --fail --show-error
