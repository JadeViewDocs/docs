# 用 Docker 部署到个人服务器（Webhook 方式）—— 移植自旧站，替换旧站部署。
# 流程：构建机生成发行快照 → 构建并推送镜像到 Docker Hub → curl 触发服务器 webhook 拉取重启。
# 用与旧站「相同的镜像名 + 相同的 webhook」，服务器拉取后即用新站替换旧站。
#
# 需要在本仓库 Settings → Secrets 配置（与旧站同名）：
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN / WEBHOOK_URL / WEBHOOK_TOKEN
# 替换旧站后，记得停用旧仓库的 deploy-docker 工作流，避免两边都往同一镜像/服务器推。
name: 构建并部署到服务器（Docker）

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
  # 发行库（tuyangJs/JadeView）发版后自动触发：release.yml 收尾向本仓库发
  # repository_dispatch，构建时重新生成发行快照，站点即刻带上新版本数据。
  repository_dispatch:
    types: [refresh-releases]

env:
  IMAGE_NAME: yiminger/jadeview_docs
  MCP_IMAGE_NAME: yiminger/jadeview_docs_mcp

concurrency:
  group: docker-deploy
  cancel-in-progress: false

# packages:write：GITHUB_TOKEN 推 ghcr.io 需要（默认只读，推包会报
# "installation not allowed to Create organization package"）
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 关键点：把所有步骤的默认都设为 fail-fast —— 任何一步失败，后续 step 不再
    # 执行，也不会继续 push/部署。buildx 单 RUN exit 1 被包成 step failure，
    # 这俩属性让这个 failure 一路传到底，不"半失败半成功"地往下走。
    defaults:
      run:
        shell: bash -euo pipefail {0}
    outputs:
      # 站点镜像：构建成功后把 digest 暴露给下游；deploy step 只在 digest 非空、
      # 且本 job 整体 success() 时才执行。用作"构建真的成功"的硬信号。
      site_digest: ${{ steps.build_site.outputs.digest }}
      mcp_digest:  ${{ steps.build_mcp.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 构建机（海外、可达 GitHub）先生成发行快照，带 token 提限额；
      # 镜像构建内用 `npx dumi build` 不再直连 GitHub（见 Dockerfile 说明）。
      # 脚本仅用 Node 内置模块，无需安装依赖。
      - name: 生成发行快照
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-changelog.mjs

      # 贡献者快照：按文档页拉提交作者 + 下载头像为同源静态文件（运行时不连 GitHub）。
      # 与发行快照同理，只在构建机执行，产物随源码 COPY 进镜像。
      - name: 生成文档贡献者快照
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-contributors.mjs

      # 给 buildx 挂载的缓存路径开启 Actions 层缓存（跨 run 复用 /root/.npm），
      # 作为 Dockerfile 里的 `--mount=type=cache,target=/root/.npm` 的进一步后端，
      # 即便 BuildKit 自身缓存被清理，也能从 Actions cache 还原。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 同时登录 ghcr.io：国内服务器拉 docker.io 基本不通（直连超时、公共加速器 403），
      # ghcr 国内可达性好，作为服务器实际拉取源。
      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送站点镜像
        id: build_site
        uses: docker/build-push-action@v6
        # 关键点：构建失败绝不能静默继续。默认就会 fail，但显式声明 + 用 outputs 存
        # digest 能保证下游能"用 digest 非空"判定成功，避免把 failure 当 success 继续走。
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          # BuildKit 自带持久化缓存（GitHub runner 本机层），再加 Actions cache
          # 后端：npm ci 的 tarball、node-gyp 编译中间产物、dumi build 的
          # utoopack cache 都能跨 run 复用。
          cache-from: type=gha,scope=docs-site
          cache-to:   type=gha,scope=docs-site,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/jadeviewdocs/docs:latest
            ghcr.io/jadeviewdocs/docs:${{ github.sha }}

      # MCP 服务镜像：与站点同源，打包 docs/ markdown，启动时建索引。
      - name: 构建并推送 MCP 镜像
        id: build_mcp
        if: steps.build_site.outcome == 'success'   # 站点都没推成，MCP 也没必要单独推
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile
          push: true
          provenance: false
          cache-from: type=gha,scope=docs-mcp
          cache-to:   type=gha,scope=docs-mcp,mode=max
          tags: |
            ${{ env.MCP_IMAGE_NAME }}:latest
            ${{ env.MCP_IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/jadeviewdocs/docs-mcp:latest
            ghcr.io/jadeviewdocs/docs-mcp:${{ github.sha }}

      # —— 关键：触发服务器部署 ——
      # 执行条件（AND）：
      #   1. success()          —— 前面所有步骤（build_site/build_mcp）都成功
      #   2. build_site 真成功  —— outputs.digest 非空（build-push-action 只有 push 成
      #                           功才写 digest）；npm ci exit 1 时 build_site 失败，digest 为空串
      #   ⚠️ 不能在这里判断 secrets：GitHub Actions 的 `if:` 表达式不允许引用
      #      secrets 上下文（报 Unrecognized named-value: 'secrets'，整个 workflow
      #      解析失败、静默不跑）。凭证是否配置改在 run 里检查。
      - name: 触发服务器 webhook 拉取部署
        if: >-
          success() &&
          steps.build_site.outcome == 'success' &&
          steps.build_site.outputs.digest != ''
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail

          # 未配置凭证时跳过部署（构建/推送已完成，只是不触发服务器）
          if [ -z "${WEBHOOK_URL}" ] || [ -z "${WEBHOOK_TOKEN}" ]; then
            echo "::warning::未配置 WEBHOOK_URL / WEBHOOK_TOKEN，跳过部署触发"
            exit 0
          fi

          # 拿到实际推送到 ghcr.io 的 digest（@sha256:…），比 latest tag 更可靠：
          # latest 可能因为竞态被另一个并发 run 覆盖，服务器 pull 拉到旧内容；
          # digest 指向本次构建的唯一 layer，不会错位。
          DIGEST="${{ steps.build_site.outputs.digest }}"
          echo "本次构建 digest: ${DIGEST}"

          curl -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${WEBHOOK_TOKEN}" \
            -d "$(cat <<JSON
          {
            "image":      "ghcr.io/jadeviewdocs/docs@${DIGEST}",
            "image_tag":  "ghcr.io/jadeviewdocs/docs:latest",
            "repository": "${{ github.repository }}",
            "commit":     "${{ github.sha }}",
            "actor":      "${{ github.actor }}",
            "digest":     "${DIGEST}"
          }
          JSON
          )" \
            --connect-timeout 10 \
            --max-time 300 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 120 \
            --fail --show-error \
            --silent | tail -20
