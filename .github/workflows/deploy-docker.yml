# 用 Docker 部署到个人服务器（Webhook 方式）—— 移植自旧站，替换旧站部署。
# 流程：构建机生成发行快照 → 构建并推送镜像到 Docker Hub → curl 触发服务器 webhook 拉取重启。
# 用与旧站「相同的镜像名 + 相同的 webhook」，服务器拉取后即用新站替换旧站。
#
# 需要在本仓库 Settings → Secrets 配置（与旧站同名）：
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN / WEBHOOK_URL / WEBHOOK_TOKEN
#   ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD（仅发版时同步到 ACR 用到）
# 替换旧站后，记得停用旧仓库的 deploy-docker 工作流，避免两边都往同一镜像/服务器推。
#
# 关于耗时（CI 构建耗时分析结论）：
#   把镜像层跨境推到阿里云（cn-shanghai 个人版 ACR）曾占整条流水线 ~86%（约 36 分钟），
#   是构建瓶颈。因此改为——日常 main / 手动触发只推 Docker Hub（~6 分钟完成部署）；
#   阿里云 ACR 同步仅在「发行库发版」时由一个非阻塞后台 job 异步完成，不拖慢日常构建。
#   digest 内容寻址、跨 registry 一致，服务器从 ACR 拉取时复用同一 digest，无需等待同步。
name: 构建并部署到服务器（Docker）

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
  # 发行库（tuyangJs/JadeView）发版后自动触发：release.yml 收尾向本仓库发
  # repository_dispatch，构建时重新生成发行快照，站点即刻带上新版本数据。
  repository_dispatch:
    types: [refresh-releases]

env:
  IMAGE_NAME: yiminger/jadeview_docs
  # 阿里云 ACR（个人版）——国内服务器从它拉镜像最快。需在仓库 Secrets 配置
  # ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD（ACR 控制台「访问凭证」的固定密码）。
  # 注意：日常构建不再推 ACR（见 push-acr job 的触发条件）。
  ACR_REGISTRY: crpi-pn3h0f31scvitb63.cn-shanghai.personal.cr.aliyuncs.com
  # 命名空间 jadeviewdocs，仓库名 main
  ACR_IMAGE: crpi-pn3h0f31scvitb63.cn-shanghai.personal.cr.aliyuncs.com/jadeviewdocs/main

concurrency:
  group: docker-deploy
  cancel-in-progress: false

# contents: read 足够——推送 Docker Hub / ACR 用的是各自的 token，而非 GITHUB_TOKEN。
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 关键点：把所有步骤的默认都设为 fail-fast —— 任何一步失败，后续 step 不再
    # 执行，也不会继续 push/部署。buildx 单 RUN exit 1 被包成 step failure，
    # 这俩属性让这个 failure 一路传到底，不"半失败半成功"地往下走。
    defaults:
      run:
        shell: bash -euo pipefail {0}
    outputs:
      # 站点镜像：构建成功后把 digest 暴露给下游；deploy step 只在 digest 非空、
      # 且本 job 整体 success() 时才执行。用作"构建真的成功"的硬信号。
      site_digest: ${{ steps.build_site.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 构建机（海外、可达 GitHub）先生成发行快照，带 token 提限额；
      # 镜像构建内用 `npx dumi build` 不再直连 GitHub（见 Dockerfile 说明）。
      # 脚本仅用 Node 内置模块，无需安装依赖。
      - name: 生成发行快照
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-changelog.mjs

      # 贡献者快照：按文档页拉提交作者 + 下载头像为同源静态文件（运行时不连 GitHub）。
      # 与发行快照同理，只在构建机执行，产物随源码 COPY 进镜像。
      - name: 生成文档贡献者快照
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-contributors.mjs

      # 给 buildx 挂载的缓存路径开启 Actions 层缓存（跨 run 复用 /root/.npm），
      # 作为 Dockerfile 里的 `--mount=type=cache,target=/root/.npm` 的进一步后端，
      # 即便 BuildKit 自身缓存被清理，也能从 Actions cache 还原。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建并推送站点镜像（仅 Docker Hub）。日常构建只推这里，因此不再有
      # 「跨境上传到阿里云 ACR」的 30+ 分钟阻塞，整条流水线约 6 分钟完成构建+部署。
      - name: 构建并推送站点镜像（Docker Hub）
        id: build_site
        uses: docker/build-push-action@v6
        # 关键点：构建失败绝不能静默继续。默认就会 fail，但显式声明 + 用 outputs 存
        # digest 能保证下游能"用 digest 非空"判定成功，避免把 failure 当 success 继续走。
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          # BuildKit 自带持久化缓存（GitHub runner 本机层），再加 Actions cache
          # 后端：npm ci 的 tarball、node-gyp 编译中间产物、dumi build 的
          # utoopack cache 都能跨 run 复用。
          cache-from: type=gha,scope=docs-site
          cache-to:   type=gha,scope=docs-site,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # MCP 服务镜像已移除：HTTP 版 MCP 由 npm 包 jadeview-docs-mcp（stdio）替代，
      # 见 mcp/ 与 .github/workflows/publish-npm.yml。

      # —— 关键：触发服务器部署 ——
      # 执行条件（AND）：
      #   1. success()          —— 前面所有步骤（build_site）都成功
      #   2. build_site 真成功  —— outputs.digest 非空（build-push-action 只有 push 成
      #                           功才写 digest）；npm ci exit 1 时 build_site 失败，digest 为空串
      #   ⚠️ 不能在这里判断 secrets：GitHub Actions 的 `if:` 表达式不允许引用
      #      secrets 上下文（报 Unrecognized named-value: 'secrets'，整个 workflow
      #      解析失败、静默不跑）。凭证是否配置改在 run 里检查。
      - name: 触发服务器 webhook 拉取部署
        if: >-
          success() &&
          steps.build_site.outcome == 'success' &&
          steps.build_site.outputs.digest != ''
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail

          # 未配置凭证时跳过部署（构建/推送已完成，只是不触发服务器）
          if [ -z "${WEBHOOK_URL}" ] || [ -z "${WEBHOOK_TOKEN}" ]; then
            echo "::warning::未配置 WEBHOOK_URL / WEBHOOK_TOKEN，跳过部署触发"
            exit 0
          fi

          # 拿到实际推送到 Docker Hub 的 digest（@sha256:…），比 latest tag 更可靠：
          # latest 可能因为竞态被另一个并发 run 覆盖，服务器 pull 拉到旧内容；
          # digest 指向本次构建的唯一 layer，不会错位。digest 内容寻址、跨 registry
          # 一致，因此发版时异步同步到 ACR 的也是同一 digest，无需等待。
          DIGEST="${{ steps.build_site.outputs.digest }}"
          echo "本次构建 digest: ${DIGEST}"

          # 主拉取源用 Docker Hub（日常构建只推 Docker Hub，最快）；发版时 ACR 由
          # push-acr job 异步补齐，服务器后续若从 ACR 拉取则复用同一 digest。
          curl -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${WEBHOOK_TOKEN}" \
            -d "$(cat <<JSON
          {
            "image":      "${{ env.IMAGE_NAME }}@${DIGEST}",
            "image_tag":  "${{ env.IMAGE_NAME }}:latest",
            "repository": "${{ github.repository }}",
            "commit":     "${{ github.sha }}",
            "actor":      "${{ github.actor }}",
            "digest":     "${DIGEST}"
          }
          JSON
          )" \
            --connect-timeout 10 \
            --max-time 300 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 120 \
            --fail --show-error \
            --silent | tail -20

  # 阿里云 ACR（个人版）镜像同步：仅在「发行库发版」时异步推送，且为非阻塞任务。
  # 日常 main / 手动触发只走 Docker Hub（见 build-and-push），避免把镜像层跨境推到
  # cn-shanghai 个人版 ACR 的 35+ 分钟成为构建瓶颈（详见 CI 构建耗时分析）。
  # 做法：从 Docker Hub 拉取刚构建好的镜像（同一 digest），重新 tag 后推到 ACR，
  # 因此不会二次执行 dumi build / prerender，也不阻塞已完成的部署。
  # digest 内容寻址、跨 registry 一致，服务器后续从 ACR 拉取时复用同一 digest。
  push-acr:
    needs: build-and-push
    # 仅发版事件同步 ACR；日常 push / 手动触发跳过本 job，省去 30+ 分钟上传。
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'refresh-releases'
    runs-on: ubuntu-latest
    # 最佳努力同步：失败（如 ACR 凭证过期）不阻断已完成的部署，整体 workflow 仍成功。
    continue-on-error: true
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: 登录 Docker Hub（拉取刚构建的镜像）
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录阿里云 ACR（推送）
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: 从 Docker Hub 拉取并同步到 ACR
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}:latest"
          docker pull "${IMAGE_NAME}:${SHA}"
          docker tag "${IMAGE_NAME}:latest" "${ACR_IMAGE}:latest"
          docker tag "${IMAGE_NAME}:${SHA}"  "${ACR_IMAGE}:${SHA}"
          docker push "${ACR_IMAGE}:latest"
          docker push "${ACR_IMAGE}:${SHA}"
          echo "::notice::已异步同步镜像到 ACR（${ACR_IMAGE}），digest 与 Docker Hub 一致"
